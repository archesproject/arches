services:
    arches:
        image: "fargeo/arches"
        build:
            args:
                ARCHES_PROJECT: "arches"
                ARCHES_PROJECT_PACKAGE: "arches"
                BUILD_FRONTEND: "false"
            context: .
            dockerfile: ${ARCHES_DOCKER:-/Users/aarongundel/copilot-worktrees/copilot-worktrees/arches-docker/adg-fuzzy-engine}/production/Dockerfile.alpine
        command: run_dev_server
        volumes:
            - ${ARCHES_CORE_HOST_DIR:-../arches/}:/opt/arches
            - ./:/opt/arches
        ports:
            - ${HOST_PROJECT_PORT:-8096}:80
            - ${HOST_PROJECT_DEBUG_PORT:-8099}:5678
        stdin_open: true
        tty: true
        environment:
            ARCHES_PROJECT: "arches"
            INSTALL_DEFAULT_GRAPHS: "False"
            INSTALL_DEFAULT_CONCEPTS: "False"
            PGUSER: postgres
            PGPASSWORD: postgis
            PGDATABASE: "arches"
            PGHOST: postgres
            PGPORT: "5432"
            DJANGO_MODE: DEV
            DJANGO_DEBUG: "True"
            ARCHES_DJANGO_DEBUG: "True"
            DOMAIN_NAMES: "*"
            DJANGO_PORT: "80"
            PYTHONUNBUFFERED: "0"
            TZ: PST
            ARCHES_ES_INDEX_PREFIX: "arches"
            ARCHES_ESHOST: elasticsearch
            ARCHES_ESPORT: "9200"
            ARCHES_ESPASSWORD: changeme
            ARCHES_CELERY_BROKER_URL: amqp://arches:arches@rabbitmq:5672/
        depends_on:
            postgres:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
            webpack:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/80' 2>/dev/null || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    webpack:
        image: "fargeo/arches"
        command: run_webpack_dev_server
        volumes:
            - ${ARCHES_CORE_HOST_DIR:-../arches/}:/opt/arches
            - ./:/opt/arches
        environment:
            ARCHES_PROJECT: "arches"
            ARCHES_PUBLIC_SERVER_ADDRESS: http://arches:80/
        # Gate on a real first compile, not just the container being alive.
        healthcheck:
            test: ["CMD-SHELL", "test -f $$APP_ROOT/webpack/webpack-stats.json && ! grep -q '^{}$$' $$APP_ROOT/webpack/webpack-stats.json"]
            interval: 5s
            timeout: 5s
            retries: 60
            start_period: 180s

    # Runs the project's Python test suite once on startup, then stays up watching
    # for file changes to re-run it automatically. Set ARCHES_TEST_RUN_ON_START=false
    # to skip the initial run and stay idle until the first watched file changes.
    # For a one-shot run instead, use `make test`.
    tests:
        image: "fargeo/arches"
        command: run_tests_watch
        volumes:
            - ${ARCHES_CORE_HOST_DIR:-../arches/}:/opt/arches
            - ./:/opt/arches
        environment:
            ARCHES_PROJECT: "arches"
            PGUSER: postgres
            PGPASSWORD: postgis
            PGDATABASE: "arches"
            PGHOST: postgres
            PGPORT: "5432"
            # Distinct from the app's index prefix so a test run's indices never
            # collide with, or get cleaned up alongside, dev data.
            ARCHES_TEST_ES_INDEX_PREFIX: "test_arches"
            ARCHES_ESHOST: elasticsearch
            ARCHES_ESPORT: "9200"
            ARCHES_ESPASSWORD: changeme
        depends_on:
            postgres:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        stdin_open: true
        tty: true

    celery:
        image: "fargeo/arches"
        command: run_celery
        volumes:
            - ${ARCHES_CORE_HOST_DIR:-../arches/}:/opt/arches
            - ./:/opt/arches
        environment:
            ARCHES_PROJECT: "arches"
            PGUSER: postgres
            PGPASSWORD: postgis
            PGDATABASE: "arches"
            PGHOST: postgres
            PGPORT: "5432"
            ARCHES_ES_INDEX_PREFIX: "arches"
            ARCHES_ESHOST: elasticsearch
            ARCHES_ESPORT: "9200"
            ARCHES_ESPASSWORD: changeme
            ARCHES_CELERY_BROKER_URL: amqp://arches:arches@rabbitmq:5672/
        depends_on:
            rabbitmq:
                condition: service_healthy
            postgres:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy

    rabbitmq:
        image: rabbitmq:3-management
        environment:
            RABBITMQ_DEFAULT_USER: arches
            RABBITMQ_DEFAULT_PASS: arches
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10

    postgres:
        image: postgis/postgis:16-3.5
        platform: linux/amd64
        volumes:
            - postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgis
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 3s
            timeout: 5s
            retries: 10

    elasticsearch:
        image: elasticsearch:8.15.5
        volumes:
            - es-data:/usr/share/elasticsearch/data
        environment:
            discovery.type: single-node
            xpack.security.enabled: "true"
            ELASTIC_PASSWORD: changeme
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        healthcheck:
            test: ["CMD-SHELL", "curl -sf -u elastic:changeme http://localhost:9200/_cluster/health || exit 1"]
            interval: 5s
            timeout: 10s
            retries: 20

    geoserver:
        image: docker.osgeo.org/geoserver:2.28.x
        profiles:
            - geoserver
        volumes:
            - geoserver-data:/opt/geoserver/data_dir
        ports:
            - ${HOST_GEOSERVER_PORT:-8080}:8080
        environment:
            INSTALL_EXTENSIONS: "true"
            COMMUNITY_EXTENSIONS: sec-oidc
            GEOSERVER_ADMIN_USER: admin
            GEOSERVER_ADMIN_PASSWORD: geoserver
        healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 60s
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
    es-data:
    geoserver-data:
