{% load i18n %}
<div class="row widget-container">
    <div class="form-group">
        <div class="relative">
            <label class="col-xs-12 control-label widget-input-label">
                <span data-bind="text: $root.translations.triggeringNodegroups"></span>
            </label>
        </div>

        <div class="col-xs-12">
            <select 
                multiple 
                data-bind="
                    attr: {'data-label': $root.translations.triggeringNodegroups},
                    options: cards,
                    optionsText: 'name',
                    optionsValue: 'nodegroup_id',
                    select2Query: {select2Config: {
                        value: triggering_nodegroups,
                        multiple: true,
                        placeholder: $root.translations.selectANodegroup
                    }}
                "
            ></select>
        </div>
    </div>
</div>
